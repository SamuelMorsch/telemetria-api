name: CI - API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancela execuções antigas da mesma branch quando chega um commit novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes e qualidade
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout do código (histórico completo, exigido pelo SonarQube Cloud)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Node.js 22 (mesma versão do Dockerfile)
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Dependências
        run: npm ci

      - name: Testes automatizados (com relatório de cobertura)
        run: |
          mkdir -p coverage
          node --test --experimental-test-coverage \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=coverage/lcov.info

      - name: Análise SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  imagem:
    name: Imagem Docker
    needs: testes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      ACTOR: ${{ github.actor }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      # Em pull request só valida que a imagem constrói; só publica quando o código chega na main.
      - name: Build da imagem (validação)
        if: github.event_name == 'pull_request'
        run: docker build -t telemetria-api:pr .

      - name: Login no GitHub Container Registry
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Build e publicação da imagem
        if: github.event_name == 'push'
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/telemetria-api"
          docker build -t "$IMAGE:main" -t "$IMAGE:${GITHUB_SHA::7}" .
          docker push "$IMAGE:main"
          docker push "$IMAGE:${GITHUB_SHA::7}"
