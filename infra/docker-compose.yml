# Stack de produção: banco + API + painel + proxy HTTPS.
# Uso: docker compose up -d --build   (dentro da pasta infra/)
name: telemetria

services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Ajustes para uma máquina de 1 GB de RAM
    command: >
      postgres
      -c shared_buffers=64MB
      -c effective_cache_size=256MB
      -c work_mem=2MB
      -c maintenance_work_mem=32MB
      -c max_connections=30
      -c timescaledb.telemetry_level=off
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 300m
    # Sem "ports": o banco NÃO fica exposto na internet, só a API o enxerga.

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no arquivo .env (openssl rand -hex 32)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 192m
    # Sem "ports": quem fala com a API é o proxy (caddy), pela rede interna.

  painel:
    # Imagem construída no CI do repositório do painel e publicada no GitHub Container Registry.
    image: ghcr.io/samuelmorsch/painel-telemetria-web:${PAINEL_TAG:-main}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/login || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 200m
    # Sem "ports": o Caddy encaminha o tráfego pela rede interna.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # guarda os certificados HTTPS
      - caddy_config:/config
    depends_on:
      - api
      - painel
    mem_limit: 64m

volumes:
  db_data:
  caddy_data:
  caddy_config:
