# Stack de produção: banco + API + painel + proxy HTTPS + métricas (Prometheus) + painéis (Grafana).
# Uso: docker compose up -d   (dentro da pasta infra/)
# As imagens da API e do painel são construídas pelo CI e publicadas no GitHub Container Registry.
name: telemetria

services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Ajustes para uma máquina de 1 GB de RAM
    command: >
      postgres
      -c shared_buffers=64MB
      -c effective_cache_size=256MB
      -c work_mem=2MB
      -c maintenance_work_mem=32MB
      -c max_connections=30
      -c timescaledb.telemetry_level=off
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 300m
    # Sem "ports": o banco NÃO fica exposto na internet, só a API o enxerga.

  api:
    # Imagem construída no CI do repositório da API e publicada no GitHub Container Registry.
    # API_TAG permite fixar uma versão (ex.: o código de um commit) para voltar atrás se preciso.
    image: ghcr.io/samuelmorsch/telemetria-api:${API_TAG:-main}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no arquivo .env (openssl rand -hex 32)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 192m
    # Sem "ports": quem fala com a API é o proxy (caddy), pela rede interna.

  painel:
    # Imagem construída no CI do repositório do painel e publicada no GitHub Container Registry.
    image: ghcr.io/samuelmorsch/painel-telemetria-web:${PAINEL_TAG:-main}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/login || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 200m
    # Sem "ports": o Caddy encaminha o tráfego pela rede interna.

  prometheus:
    # Coleta as métricas da API (GET /metrics, só na rede interna) a cada 15 s.
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=500MB
    environment:
      # Faz o coletor de lixo respeitar o limite de memória do container (máquina de 1 GB).
      GOMEMLIMIT: 128MiB
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 160m
    # Sem "ports": o Prometheus não fica exposto na internet.

  grafana:
    # Painéis de observabilidade, servidos em https://DOMINIO/grafana/ pelo Caddy.
    # A fonte de dados e o painel "Telemetria" são provisionados a partir de arquivos deste repositório.
    image: grafana/grafana:12.2.1
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: https://${DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD no arquivo .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Visitantes sem login só enxergam os painéis (papel Viewer). Para exigir login: GRAFANA_ANONYMOUS=false.
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/telemetria.json
      # Menos consumo e nenhuma conexão desnecessária numa máquina de 1 GB.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_LOG_LEVEL: warn
      GOMEMLIMIT: 160MiB
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/grafana/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    mem_limit: 192m
    # Sem "ports": o acesso é só pelo Caddy, em /grafana.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # guarda os certificados HTTPS
      - caddy_config:/config
    depends_on:
      - api
      - painel
    mem_limit: 64m

volumes:
  db_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
