sonar.organization=samuelmorsch
sonar.projectKey=SamuelMorsch_telemetria-api
sonar.projectName=telemetria-api
sonar.sourceEncoding=UTF-8

# Código da aplicação e testes
sonar.sources=src,scripts
sonar.tests=test,testing
sonar.test.inclusions=test/**/*.js,testing/**/*.js

# Cobertura de testes (gerada pelo CI com o repórter lcov do Node)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# O simulador de dispositivo é uma ferramenta de apoio e não faz parte da cobertura
sonar.coverage.exclusions=scripts/**
